[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-pdf"
version = "0.2.0"
description = "API liviana de clasificación y extracción de documentos"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<13",
  "pytesseract>=0.3.13,<1",
  "google-genai>=1.0,<2",
  "openai>=1.60,<3",
  "qstash>=3,<4",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["app*"]
