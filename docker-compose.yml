services:
  api-pdf:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
