services:
  api-pdf:
    build: .
    env_file: .env
    environment:
      GEMINI_CIRCUIT_FILE: /var/lib/api-pdf/gemini-circuit.json
    volumes:
      - api-pdf-state:/var/lib/api-pdf
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  api-pdf-state:
